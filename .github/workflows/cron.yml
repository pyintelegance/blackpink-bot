name: blink-cron
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python cron.py
      - run: |
          if git diff --quiet; then echo "no changes"; exit 0; fi
          git config user.name "blink-bot"
          git config user.email "bot@blink"
          git add -f data/sent.json
          git commit -m "update sent.json [skip ci]" || true
          git push
